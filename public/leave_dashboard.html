<!DOCTYPE html>
<html>
<head><title>Leave Dashboard</title></head>
<body>
    <h2>My Leave Requests</h2>
    <table id="leaveTable">
        <tr><th>Start Date</th><th>End Date</th><th>Status</th></tr>
    </table>
    <script>
        fetch('/api/my-leaves').then(r => r.json()).then(data => {
            const table = document.getElementById('leaveTable');
            data.forEach(l => {
                table.innerHTML += `<tr><td>${l.startDate}</td><td>${l.endDate}</td><td>${l.status}</td></tr>`;
            });
        });
    </script>
</body>
</html>
